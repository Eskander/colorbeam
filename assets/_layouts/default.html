<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site">
    <div class="bar">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <a href="https://github.com/{{ site.repository }}">GitHub</a>
      </nav>
    </div>
    <div class="palette" aria-hidden="true"></div>
  </header>

  <main class="prose">
    {% if page.show_title %}<h1>{{ page.title }}</h1>{% endif %}
    {{ content }}
  </main>

  <footer class="site">
    <a href="https://github.com/{{ site.repository }}">{{ site.repository }}</a>
  </footer>
</body>
</html>
