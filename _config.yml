title: Colorbeam
description: A Beamer theme for university lectures and lab sessions
url: https://eskander.github.io
baseurl: /colorbeam
repository: eskander/colorbeam

# All of these ship with GitHub Pages, so no workflow or Gemfile is needed.
# optional-front-matter + readme-index turn README.md and docs/*.md into pages untouched.
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

defaults:
  - scope: { path: "" }
    values: { layout: default }
  # reference.md has no H1 of its own
  - scope: { path: "docs/reference.md" }
    values: { title: Reference, show_title: true }

nav:
  - { title: Home, url: / }
  - { title: Reference, url: /docs/reference.html }
  - { title: Packaging, url: /docs/packaging.html }

# Keep the site to the markdown and the screenshots.
exclude:
  - packaging
  - "*.sty"
  - "*.tex"
  - LICENSE
  - .github
