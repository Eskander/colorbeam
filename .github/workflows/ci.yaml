name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "images/**"
      - "**.md"

jobs:
  compile-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Carlito and DejaVu Sans Mono are the theme's default fonts.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-crosextra-carlito fonts-dejavu-mono

      # Minimal TeX Live: the "basic" scheme plus only what the template loads.
      # The list below was taken from the files a real compile reads
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4.1.1
        with:
          scheme: basic
          packages: |
            amscls
            amsfonts
            amsmath
            atbegshi
            atveryend
            auxhook
            beamer
            bigintcalc
            bitset
            circuitikz
            cm
            colortbl
            environ
            etoolbox
            fontspec
            geometry
            gettitlestring
            graphics
            graphics-cfg
            graphics-def
            hycolor
            hyperref
            iftex
            infwarerr
            intcalc
            kvdefinekeys
            kvoptions
            kvsetkeys
            l3backend
            l3kernel
            l3packages
            listings
            lm
            lm-math
            ltxcmds
            pdfcol
            pdfescape
            pdftexcmds
            pgf
            pgfplots
            polyglossia
            psnfss
            refcount
            rerunfilecheck
            stringenc
            tcolorbox
            tikzfill
            tools
            translator
            trimspaces
            uniquecounter
            url
            xcolor
            xetex
            xkeyval

      # Two runs: the TikZ overlays need a second pass.
      # Any compilation error fails the job (-halt-on-error); warnings do not.
      - name: Compile template (run 1)
        run: xelatex -interaction=nonstopmode -halt-on-error -file-line-error colorbeam-template.tex

      - name: Compile template (run 2)
        run: xelatex -interaction=nonstopmode -halt-on-error -file-line-error colorbeam-template.tex

      - name: Upload PDF and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colorbeam-template
          path: |
            colorbeam-template.pdf
            colorbeam-template.log
          if-no-files-found: ignore
